name: CI/CD - Nemesis Cyber Defense

# CI: en cada push o Pull Request se ejecuta la suite de pruebas automatizadas (pytest) y la
#     verificación del frontend. El resultado queda visible en la pestaña Actions y en el PR,
#     ANTES de que el cambio se integre a la rama principal.
# CD: solo si el CI pasó y el cambio llegó a main, se construyen las imágenes Docker y se
#     dispara el despliegue en Render.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # github.repository puede tener mayúsculas (ej. FYaguana) y Docker exige minúsculas:
  # estos sufijos se combinan en minúsculas en el job docker-build-push.
  IMAGE_BACKEND_SUFFIX: nemesis-backend
  IMAGE_FRONTEND_SUFFIX: nemesis-frontend

jobs:
  # ---------------------------------------------------------------------
  # CI 1) Pruebas automatizadas del backend (pytest) sobre los módulos críticos:
  #       autenticación, roles, motor de alertas, aprendizaje activo, dispositivos,
  #       pipeline de datos y modelos entregados.
  # ---------------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ejecutar la suite de pruebas (pytest)
        working-directory: backend
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: python -m pytest tests -v --tb=short

  # ---------------------------------------------------------------------
  # CI 2) Verificación del frontend: sintaxis de los .js y de los scripts
  #       embebidos en cada página HTML.
  # ---------------------------------------------------------------------
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar sintaxis de los archivos .js
        run: |
          for f in $(find frontend -name "*.js"); do
            echo "Verificando $f"
            node --check "$f"
          done

      - name: Validar sintaxis de los scripts embebidos en los HTML
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, glob
          fallos = 0
          for html in sorted(glob.glob("frontend/*.html")):
              texto = open(html, encoding="utf-8").read()
              for i, bloque in enumerate(re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", texto, re.S)):
                  if not bloque.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as t:
                      t.write(bloque)
                  r = subprocess.run(["node", "--check", t.name], capture_output=True, text=True)
                  if r.returncode:
                      fallos += 1
                      print(f"ERROR en {html} (script #{i}):\n{r.stderr}")
                  else:
                      print(f"OK {html} (script #{i})")
          sys.exit(1 if fallos else 0)
          PY

  # ---------------------------------------------------------------------
  # CD 1) Build y push de las imágenes Docker a GitHub Container Registry.
  #       Solo en push a main, y solo si TODO el CI pasó.
  # ---------------------------------------------------------------------
  docker-build-push:
    needs: [backend-test, frontend-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre de imagen en minúsculas
        run: |
          echo "IMAGE_BACKEND=$(echo '${{ github.repository }}/${{ env.IMAGE_BACKEND_SUFFIX }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_FRONTEND=$(echo '${{ github.repository }}/${{ env.IMAGE_FRONTEND_SUFFIX }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # CD 2) Despliegue en Render. Render ya redespliega solo ante cada push (Auto-Deploy);
  #       este paso es opcional y sirve para disparar el despliegue DESPUÉS de que el CI
  #       pasó, si se configura el secret DEPLOY_HOOK_URL (y se desactiva el Auto-Deploy).
  # ---------------------------------------------------------------------
  deploy:
    needs: [docker-build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook (si está configurado)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$DEPLOY_HOOK_URL"
            echo "Deploy hook disparado."
          else
            echo "DEPLOY_HOOK_URL no configurado; saltando deploy por hook."
          fi
