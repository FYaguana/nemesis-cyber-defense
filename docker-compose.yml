services:
  backend:
    build: ./backend
    container_name: nemesis-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    environment:
      - ORIGENES_FRONTEND_PERMITIDOS=http://localhost:5173
      # - GEMINI_API_KEY=  # opcional: si se define acá, tiene prioridad sobre
      #                      la key guardada desde el panel de administración
    # Necesario para que scapy pueda capturar tráfico de red real dentro del contenedor.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host  # requerido para que la captura de paquetes vea la red real del host

  frontend:
    build: ./frontend
    container_name: nemesis-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
