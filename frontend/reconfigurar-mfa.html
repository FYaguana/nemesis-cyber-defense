<!DOCTYPE html>
<html lang="es">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconfigurar MFA - Nemesis Cyber Defense</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050b14;color:#e8f0f7;font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#0a1420;border:1px solid #14283d;border-radius:14px;padding:32px;
    max-width:400px;width:100%;text-align:center}
  h1{font-size:1.3rem;color:#aa66ff;margin-bottom:6px}
  p{color:#7a95ad;font-size:.85rem;line-height:1.5;margin-bottom:16px}
  .qr{background:white;padding:12px;border-radius:10px;display:inline-block;margin:10px 0}
  .qr img{display:block;width:200px;height:200px}
  .secreto{font-family:'Courier New',monospace;font-size:.8rem;color:#00ff88;
    background:#020a12;padding:8px;border-radius:6px;word-break:break-all;margin-bottom:16px}
  input{width:100%;padding:12px;font-size:1.3rem;text-align:center;letter-spacing:6px;
    background:#0d1b2a;border:1px solid #14283d;border-radius:8px;color:#e8f0f7;margin-bottom:12px}
  button{width:100%;padding:12px;background:#6600cc;color:white;border:none;border-radius:8px;
    font-size:.95rem;font-weight:bold;cursor:pointer}
  .err{color:#ff6666;font-size:.8rem;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>📱 Reconfigurar MFA</h1>
  <p>Cargando...</p>
</div>
<script>
const URL_BASE_API = (typeof window.NEMESIS_API_URL !== "undefined") ? window.NEMESIS_API_URL : "http://localhost:8000";
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
let usuarioId = null, secreto = null;

async function cargar(){
  const card = document.getElementById('card');
  if(!token){ card.innerHTML = '<h1>❌ Link inválido</h1><p>Falta el token.</p>'; return; }
  try{
    const r = await fetch(`${URL_BASE_API}/api/auth/mfa-reset/preparar?token=` + encodeURIComponent(token), {credentials:'include'});
    if(!r.ok){
      const err = await r.json();
      card.innerHTML = `<h1>❌ No se pudo continuar</h1><p>${err.detail}</p>`;
      return;
    }
    const d = await r.json();
    usuarioId = d.usuario_id; secreto = d.secreto;
    card.innerHTML = `
      <h1>📱 Reconfigurar tu MFA</h1>
      <p>Hola ${d.nombre}. Tu verificación en dos pasos anterior ya no es válida.
      Escaneá este nuevo código con tu app autenticadora:</p>
      <div class="qr"><img src="data:image/png;base64,${d.qr_base64}"></div>
      <p style="font-size:.72rem">¿No podés escanear? Ingresá esta clave manualmente:</p>
      <div class="secreto">${secreto}</div>
      <p>Ingresá el código de 6 dígitos que te muestra la app para confirmar:</p>
      <input type="text" id="codigo" maxlength="6" inputmode="numeric" placeholder="000000">
      <button onclick="confirmar()">Confirmar nuevo MFA</button>
      <div class="err" id="err"></div>
    `;
  }catch(e){
    card.innerHTML = '<h1>❌ Error</h1><p>No se pudo conectar con el servidor.</p>';
  }
}

async function confirmar(){
  const codigo = document.getElementById('codigo').value.trim();
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  if(codigo.length !== 6){ errEl.textContent = 'Ingresá los 6 dígitos.'; errEl.style.display='block'; return; }
  try{
    const r = await fetch(`${URL_BASE_API}/api/auth/mfa-reset/confirmar`, {
      credentials: 'include',
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({usuario_id: usuarioId, secreto, codigo})
    });
    const d = await r.json();
    if(!r.ok){ errEl.textContent = d.detail || 'Código incorrecto.'; errEl.style.display='block'; return; }
    document.getElementById('card').innerHTML =
      '<h1>✅ MFA reconfigurado</h1><p>Ya podés iniciar sesión normalmente con tu contraseña y el nuevo código.</p>' +
      '<button onclick="window.location.href=\'/\'">Ir al login</button>';
  }catch(e){
    errEl.textContent = 'Error de conexión: ' + e.message; errEl.style.display='block';
  }
}
cargar();
</script>
</body>
</html>
