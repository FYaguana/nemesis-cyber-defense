<!DOCTYPE html>
<html lang="es"><head><script src="config.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nemesis – Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050c14;--s:#0d1521;--s2:#111f35;--b:#1e3a5f;--a:#00d4ff;
  --g:#00ff88;--r:#ff4444;--y:#ffaa00;--p:#aa66ff;--t:#c8d8e8;--m:#4a6a8a}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--t);
  min-height:100vh;display:flex}
.sb{width:210px;flex-shrink:0;background:var(--s);border-right:1px solid var(--b);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.sb-logo{padding:18px;border-bottom:1px solid var(--b);
  display:flex;align-items:center;gap:9px}
.sb-icon{width:34px;height:34px;background:linear-gradient(135deg,#0062cc,#00d4ff);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;box-shadow:0 0 14px rgba(0,212,255,.3)}
.sb-logo h2{font-size:.82rem;color:var(--a);font-weight:700;letter-spacing:1.5px}
.sb-logo p{font-size:.6rem;color:var(--m);font-family:'Share Tech Mono',monospace}
.nav{flex:1;padding:12px 0}
.ns{font-size:.6rem;color:var(--m);font-family:'Share Tech Mono',monospace;
  padding:8px 18px 3px;letter-spacing:1px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 18px;cursor:pointer;
  font-size:.86rem;font-weight:600;color:var(--m);transition:all .2s;
  border-left:3px solid transparent;letter-spacing:.3px}
.ni:hover{color:var(--t);background:var(--s2)}
.ni.on{color:var(--a);background:rgba(0,212,255,.05);border-left-color:var(--a)}
.ni .ic{font-size:.95rem;width:18px;text-align:center}
.up{padding:14px;border-top:1px solid var(--b)}
.uc{display:flex;align-items:center;gap:9px;background:var(--s2);
  border-radius:9px;padding:9px;margin-bottom:9px}
.av{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#0062cc,#00d4ff);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:.9rem;flex-shrink:0}
.un{font-size:.8rem;font-weight:600;color:var(--t)}
.ur{font-size:.65rem;color:var(--m);font-family:'Share Tech Mono',monospace}
.btn-lo{width:100%;padding:7px;border:1px solid var(--b);background:transparent;
  border-radius:7px;color:var(--m);font-family:'Rajdhani',sans-serif;
  font-size:.78rem;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.btn-lo:hover{border-color:#ff444433;color:#ff8888;background:#1a050533}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{height:54px;background:var(--s);border-bottom:1px solid var(--b);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;flex-shrink:0}
.tb h1{font-size:.95rem;font-weight:700;color:var(--t);letter-spacing:.8px}
.tbr{display:flex;align-items:center;gap:14px}
.live{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--g);
  font-family:'Share Tech Mono',monospace}
.ld{width:6px;height:6px;border-radius:50%;background:var(--g);
  animation:bl 1.5s ease infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.clk{font-family:'Share Tech Mono',monospace;font-size:.75rem;color:var(--m)}
.btn-an{padding:6px 14px;background:linear-gradient(135deg,#0062cc,#00d4ff);
  border:none;border-radius:7px;color:#fff;font-family:'Rajdhani',sans-serif;
  font-size:.8rem;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:all .2s}
.btn-an:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,212,255,.3)}
.cnt{flex:1;overflow-y:auto;padding:20px 24px}
.kpi-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--s);border:1px solid var(--b);border-radius:11px;
  padding:18px;position:relative;overflow:hidden;transition:transform .2s}
.kpi:hover{transform:translateY(-2px)}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.r::after{background:linear-gradient(90deg,#ff4444,#ff888844)}
.kpi.y::after{background:linear-gradient(90deg,#ffaa00,#ffcc4444)}
.kpi.g::after{background:linear-gradient(90deg,#00ff88,#00cc6644)}
.kpi.b::after{background:linear-gradient(90deg,#00d4ff,#0088cc44)}
.kpi-lbl{font-size:.68rem;color:var(--m);font-weight:600;letter-spacing:.5px;margin-bottom:7px}
.kpi-v{font-size:2rem;font-weight:700;line-height:1}
.kpi.r .kpi-v{color:#ff4444}.kpi.y .kpi-v{color:#ffaa00}
.kpi.g .kpi-v{color:#00ff88}.kpi.b .kpi-v{color:#00d4ff}
.kpi-s{font-size:.68rem;color:var(--m);margin-top:5px;font-family:'Share Tech Mono',monospace}
.kpi-ico{position:absolute;right:14px;top:14px;font-size:1.4rem;opacity:.18}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:var(--s);border:1px solid var(--b);border-radius:11px;padding:18px}
.ph{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--b)}
.pt{font-size:.84rem;font-weight:700;color:var(--a);letter-spacing:.5px}
.pb{font-size:.62rem;font-family:'Share Tech Mono',monospace;
  padding:3px 7px;border-radius:10px}
.bl{background:#00ff8822;color:#00ff88;border:1px solid #00ff8844}
.bai{background:#aa66ff22;color:#aa66ff;border:1px solid #aa66ff44}
canvas{width:100%!important}
.tbtns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tbtn{padding:7px 13px;border:1px solid var(--b);border-radius:7px;
  background:var(--s2);color:var(--m);font-family:'Rajdhani',sans-serif;
  font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.tbtn:hover{color:var(--t)}
.t-n:hover,.t-n.on{background:#00ff8811;color:#00ff88;border-color:#00ff8844}
.t-d:hover,.t-d.on{background:#ff444411;color:#ff4444;border-color:#ff444444}
.t-pr:hover,.t-pr.on{background:#4488ff11;color:#4488ff;border-color:#4488ff44}
.t-r:hover,.t-r.on{background:#ffaa0011;color:#ffaa00;border-color:#ffaa0044}
.t-u:hover,.t-u.on{background:#aa66ff11;color:#aa66ff;border-color:#aa66ff44}
.t-a:hover,.t-a.on{background:#00d4ff11;color:#00d4ff;border-color:#00d4ff44}
.rb{border-radius:9px;padding:14px;background:var(--s2);border:1px solid var(--b);
  min-height:90px;transition:border-color .3s;font-size:.83rem}
.rb.rn{border-color:#00ff8855}
.rb.rc{border-color:#ff444455;animation:pr 1.5s infinite}
.rb.ra{border-color:#ffaa0055}
@keyframes pr{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.15)}
  50%{box-shadow:0 0 0 5px rgba(255,68,68,0)}}
.al-list{max-height:300px;overflow-y:auto}
.al-item{display:flex;gap:10px;padding:9px;border-radius:7px;
  background:var(--s2);border:1px solid var(--b);margin-bottom:7px;transition:background .2s}
.al-item:hover{background:#152030}
.al-sev{width:3px;border-radius:2px;flex-shrink:0}
.al-body{flex:1;min-width:0}
.al-title{font-size:.8rem;font-weight:700;color:var(--t)}
.al-desc{font-size:.7rem;color:var(--m);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-meta{font-size:.63rem;color:var(--m);margin-top:3px;
  font-family:'Share Tech Mono',monospace;display:flex;gap:8px}
.cb{padding:2px 6px;border-radius:7px;font-size:.63rem;
  font-family:'Share Tech Mono',monospace;font-weight:700}
.sC{background:#ff4444}.sA{background:#ffaa00}.sN{background:#00ff88}.sI{background:#00aaff}
.cC{background:#ff444422;color:#ff4444;border:1px solid #ff444433}
.cA{background:#ffaa0022;color:#ffaa00;border:1px solid #ffaa0033}
.cN{background:#00ff8822;color:#00ff88;border:1px solid #00ff8833}
.ia-box{background:linear-gradient(135deg,rgba(170,102,255,.05),rgba(0,212,255,.02));
  border:1px solid rgba(170,102,255,.18);border-radius:9px;
  padding:14px;font-size:.8rem;line-height:1.6}
.ia-th{display:flex;align-items:center;gap:7px;color:var(--p);
  font-size:.75rem;font-family:'Share Tech Mono',monospace}
.ia-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--p);margin:0 2px;animation:db .8s ease infinite}
.ia-dots span:nth-child(2){animation-delay:.15s}
.ia-dots span:nth-child(3){animation-delay:.3s}
@keyframes db{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ia-step{display:flex;gap:9px;margin-bottom:7px;padding:8px;
  border-radius:7px;background:rgba(0,0,0,.18)}
.ia-num{width:20px;height:20px;border-radius:50%;background:var(--p);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:700;flex-shrink:0}
.ia-txt{font-size:.78rem}
#log{background:#020a12;border:1px solid #0d2035;border-radius:7px;
  padding:10px;font-family:'Share Tech Mono',monospace;font-size:.7rem;
  height:130px;overflow-y:auto;color:#00aa44;line-height:1.6}
.tmap{background:#020a12;border-radius:7px;height:140px;position:relative;overflow:hidden}
.mdot{position:absolute;width:7px;height:7px;border-radius:50%;
  animation:mp 2s ease infinite}
@keyframes mp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(2.5);opacity:.15}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--s)}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:2px}
</style></head><body>

<aside class="sb">
  <div class="sb-logo">
    <div class="sb-icon">🛡️</div>
    <div><h2>NEMESIS</h2><p>CYBER DEFENSE v2.0</p></div>
  </div>
  <nav class="nav">
    <div class="ns">PRINCIPAL</div>
    <div class="ni on" id="ni-dashboard" onclick="pg('dashboard',this)">
      <span class="ic">📊</span>Dashboard</div>
    <div class="ni" id="ni-redreal" onclick="pg('redreal',this)">
      <span class="ic">🌐</span>Monitoreo de Red</div>
    <div class="ni" id="ni-analizador" onclick="pg('analizador',this)">
      <span class="ic">🔍</span>Analizador</div>
    <div class="ni" id="ni-alertas" onclick="pg('alertas',this)">
      <span class="ic">🚨</span>Alertas
      <span id="badge" style="margin-left:auto;background:#ff444422;color:#ff4444;
        border-radius:8px;padding:1px 6px;font-size:.62rem;font-family:'Share Tech Mono',monospace">0</span>
    </div>
    <div class="ns" style="margin-top:6px">SOPORTE</div>
    <div class="ni" id="ni-recomendaciones" onclick="pg('recomendaciones',this)">
      <span class="ic">✨</span>Recomendaciones</div>
    <div class="ni" id="ni-usuarios" onclick="pg('usuarios',this)">
      <span class="ic">👥</span>Usuarios</div>
  </nav>
  <div class="up">
    <div class="uc">
      <div class="av">·</div>
      <div><div class="un">Cargando...</div><div class="ur"></div></div>
    </div>
    <button class="btn-lo" onclick="logout()">⟵ CERRAR SESIÓN</button>
  </div>
</aside>

<main class="main">
  <div class="tb">
    <h1 id="ptitle">PANEL DE CONTROL</h1>
    <div class="tbr">
      <div class="live"><div class="ld"></div>Sistema Activo</div>
      <div class="clk" id="clk">--:--:--</div>
      <button class="btn-an" onclick="analizar('aleatorio')">⚡ Analizar</button>
    </div>
  </div>
  <div class="cnt" id="cnt"></div>
</main>

<script>
const URL_BASE_API = window.NEMESIS_API_URL || "http://localhost:8000";
// ── Estado global ──────────────────────────────────────────────────────────
let ROL_USUARIO = null;
const C={criticas:0,advertencias:0,normales:0,total:0};
let alertas=[], monitoreo=false, mTimer=null, pg_act='dashboard';
let rrPolling=false, rrTimer=null, rrIndice=0, rrNormales=0, rrRevisar=0;
const TIPOS=['normal','normal','normal','dos','probe','r2l','u2r','normal','dos'];
let tIdx=0;
const COL={NORMAL:'#00ff88',DoS:'#ff4444',Probe:'#4488ff',R2L:'#ffaa00',U2R:'#aa66ff'};
const TITULOS={dashboard:'PANEL DE CONTROL',analizador:'ANALIZADOR DE TRÁFICO',
  alertas:'CENTRO DE ALERTAS',modelos:'MODELOS DEEP LEARNING',
  redreal:'CAPTURA DE RED REAL',
  recomendaciones:'RECOMENDACIONES IA',experimentos:'RESULTADOS – CAP. 4',
  usuarios:'GESTIÓN DE USUARIOS'};

setInterval(()=>document.getElementById('clk').textContent=
  new Date().toLocaleTimeString('es-EC'),1000);

// ── Navegación ─────────────────────────────────────────────────────────────
function pg(p,el){
  pg_act=p;
  document.getElementById('ptitle').textContent=TITULOS[p]||p;
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
  if(el)el.classList.add('on');
  render(p);
}

function render(p){
  const c=document.getElementById('cnt');
  if(p==='dashboard'){c.innerHTML=tDash();initC();}
  else if(p==='analizador')c.innerHTML=tAnaliz();
  else if(p==='alertas')c.innerHTML=tAlertas();
  else if(p==='modelos'){c.innerHTML=tModelos();loadMetrics();}
  else if(p==='redreal'){c.innerHTML=tRedReal();initRedReal();}
  else if(p==='recomendaciones'){c.innerHTML=tRec();initRec();}
  else if(p==='experimentos'){c.innerHTML=tExp();loadExp();}
  else if(p==='usuarios'){c.innerHTML=tUsuarios();initUsuarios();}
}

// ── Templates ──────────────────────────────────────────────────────────────
function tDash(){return`
<div class="kpi-g">
  <div class="kpi r"><div class="kpi-ico">🔴</div>
    <div class="kpi-lbl">ALERTAS CRÍTICAS</div>
    <div class="kpi-v" id="kc">${C.criticas}</div>
    <div class="kpi-s">Atención inmediata</div></div>
  <div class="kpi y"><div class="kpi-ico">🟡</div>
    <div class="kpi-lbl">ADVERTENCIAS</div>
    <div class="kpi-v" id="ka">${C.advertencias}</div>
    <div class="kpi-s">Revisar &lt; 30 min</div></div>
  <div class="kpi g"><div class="kpi-ico">✅</div>
    <div class="kpi-lbl">TRÁFICO NORMAL</div>
    <div class="kpi-v" id="kn">${C.normales}</div>
    <div class="kpi-s">Verificado</div></div>
  <div class="kpi b"><div class="kpi-ico">📊</div>
    <div class="kpi-lbl">TOTAL ANALIZADOS</div>
    <div class="kpi-v" id="kt">${C.total}</div>
    <div class="kpi-s">Eventos procesados</div></div>
</div>
<div class="g2">
  <div class="panel">
    <div class="ph"><span class="pt">📈 DETECCIONES EN TIEMPO REAL</span>
      <span class="pb bl">● EN VIVO</span></div>
    <canvas id="cLine" height="150"></canvas>
  </div>
  <div class="panel">
    <div class="ph"><span class="pt">🎯 DISTRIBUCIÓN DE ATAQUES</span>
      <span class="pb bl">● EN VIVO</span></div>
    <canvas id="cDonut" height="150"></canvas>
  </div>
</div>
<div class="g3">
  <div class="panel">
    <div class="ph"><span class="pt">🚨 ÚLTIMAS ALERTAS</span>
      <span class="pb bl">● TIEMPO REAL</span></div>
    <div class="al-list" id="dash-al">
      <div style="color:var(--m);font-size:.8rem;padding:16px;text-align:center">
        Usa <b style="color:var(--a)">⚡ Analizar</b> para comenzar</div>
    </div>
  </div>
  <div class="panel">
    <div class="ph"><span class="pt">🗺️ MAPA DE AMENAZAS</span></div>
    <div class="tmap" id="tmap">
      <svg width="100%" height="100%" viewBox="0 0 300 140" style="opacity:.2">
        <text x="150" y="75" text-anchor="middle" fill="#00d4ff" font-size="10"
          font-family="Share Tech Mono">MONITOREO ACTIVO</text></svg>
    </div>
    <div style="margin-top:10px"><div id="log" style="background:#020a12;border:1px solid #0d2035;
      border-radius:7px;padding:10px;font-family:'Share Tech Mono',monospace;font-size:.68rem;
      height:110px;overflow-y:auto;color:#00aa44;line-height:1.6">[NEMESIS] Sistema listo ✓</div></div>
  </div>
</div>`;}

function tAnaliz(){return`
<div class="panel" style="margin-bottom:14px">
  <div class="ph"><span class="pt">🔍 ANALIZADOR DE TRÁFICO</span>
    <span class="pb bl">● MLP + RNN/LSTM</span></div>
  <div class="tbtns">
    <button class="tbtn t-n" onclick="analizar('normal')">✅ Normal</button>
    <button class="tbtn t-d" onclick="analizar('dos')">⚡ Simular DoS</button>
    <button class="tbtn t-pr" onclick="analizar('probe')">🔭 Simular Probe</button>
    <button class="tbtn t-r" onclick="analizar('r2l')">🔑 Simular R2L</button>
    <button class="tbtn t-u" onclick="analizar('u2r')">☠️ Simular U2R</button>
    <button class="tbtn t-a" id="btn-auto" onclick="togAuto()">▶ Auto</button>
  </div>
  <div class="rb" id="rb">
    <span style="color:var(--m)">← Selecciona un tipo de tráfico para analizar</span>
  </div>
</div>
<div class="g2">
  <div class="panel">
    <div class="ph"><span class="pt">✨ RECOMENDACIONES IA</span>
      <span class="pb bai">🤖 IA</span></div>
    <div id="ia-p">
      <div style="color:var(--m);font-size:.8rem;text-align:center;padding:16px">
        Analiza un evento para ver las recomendaciones</div>
    </div>
  </div>
  <div class="panel">
    <div class="ph"><span class="pt">📋 LOG DE EVENTOS</span></div>
    <div id="log" style="background:#020a12;border:1px solid #0d2035;border-radius:7px;
      padding:10px;font-family:'Share Tech Mono',monospace;font-size:.7rem;
      height:200px;overflow-y:auto;color:#00aa44;line-height:1.6">
      [NEMESIS] Analizador listo...</div>
  </div>
</div>`;}

function tAlertas(){
  const html=alertas.length===0
    ?'<div style="color:var(--m);text-align:center;padding:40px;font-size:.85rem">Sin alertas registradas</div>'
    :alertas.map((a,i)=>alHTML(a,i)).join('');
  return`<div class="panel">
    <div class="ph"><span class="pt">🚨 CENTRO DE ALERTAS PREDICTIVAS</span>
      <span class="pb bl">Total: ${alertas.length}</span></div>
    <div class="tbtns">
      <button class="tbtn" onclick="filtrar('todas')">Todas</button>
      <button class="tbtn t-d" onclick="filtrar('CRÍTICO')">Críticas</button>
      <button class="tbtn t-r" onclick="filtrar('ADVERTENCIA')">Advertencias</button>
    </div>
    <div id="lista-al">${html}</div>
  </div>`;}

function tModelos(){return`
<div class="kpi-g">
  <div class="kpi b"><div class="kpi-ico">🧠</div>
    <div class="kpi-lbl">MLP RECALL</div>
    <div class="kpi-v" id="m-r">—</div><div class="kpi-s">Métrica prioritaria</div></div>
  <div class="kpi g"><div class="kpi-ico">🎯</div>
    <div class="kpi-lbl">PRECISIÓN</div>
    <div class="kpi-v" id="m-p">—</div><div class="kpi-s">Calidad de alertas</div></div>
  <div class="kpi b"><div class="kpi-ico">⚖️</div>
    <div class="kpi-lbl">F1-SCORE</div>
    <div class="kpi-v" id="m-f">—</div><div class="kpi-s">Balance P/R</div></div>
  <div class="kpi g"><div class="kpi-ico">✅</div>
    <div class="kpi-lbl">ACCURACY</div>
    <div class="kpi-v" id="m-a">—</div><div class="kpi-s">Exactitud global</div></div>
</div>
<div class="g2">
  <div class="panel">
    <div class="ph"><span class="pt">🏗️ ARQUITECTURA MLP</span></div>
    ${arcMLP()}
  </div>
  <div class="panel">
    <div class="ph"><span class="pt">🔄 ARQUITECTURA RNN/LSTM</span></div>
    ${arcRNN()}
  </div>
</div>`;}

function tRedReal(){return`
<div class="panel" style="margin-bottom:14px">
  <div class="ph"><span class="pt">🌐 MONITOREO DE RED</span>
    <span class="pb" style="background:#00ff8822;color:#00ff88;border:1px solid #00ff8844">
      ● DATOS REALES (no simulados)</span></div>
  <p style="font-size:.8rem;color:var(--m);margin-bottom:14px">
    Analiza en vivo el tráfico real de esta red con el mismo motor de IA del
    sistema. Corre en segundo plano de forma continua mientras el servidor
    esté encendido.
  </p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">

// Diccionario de puertos/destinos comunes en redes domésticas y corporativas,
// para traducir el flujo técnico a una frase entendible por cualquiera.
const SERVICIOS_CONOCIDOS = {
  53:'resolución de nombres (DNS)', 80:'navegación web (HTTP)',
  443:'navegación web segura (HTTPS)', 22:'acceso remoto (SSH)',
  21:'transferencia de archivos (FTP)', 25:'correo saliente (SMTP)',
  1900:'descubrimiento de dispositivos (SSDP/UPnP)',
  5353:'descubrimiento de dispositivos (mDNS)',
  67:'asignación de red (DHCP)', 68:'asignación de red (DHCP)',
};

function describirDestino(flujo){
  if(!flujo) return 'un destino desconocido';
  const ip = flujo.dst_ip || '';
  const puerto = flujo.dst_port;
  const serv = SERVICIOS_CONOCIDOS[puerto];
  const esPrivada = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(ip);
  const esAnuncio = ip.startsWith('239.') || ip.startsWith('224.') || ip === '255.255.255.255';

  if(esAnuncio)
    return `un dispositivo de tu red anunciándose${serv ? ' — '+serv : ' (normal, ej. un router o smart TV)'}`;
  if(serv && esPrivada)
    return `${serv}, con un equipo de tu propia red (${ip})`;
  if(serv)
    return `${serv}, con un servidor en internet (${ip})`;
  if(esPrivada)
    return `otro equipo dentro de tu red local (${ip}${puerto ? ', puerto '+puerto : ''})`;
  return `un servidor en internet (${ip}${puerto ? ', puerto '+puerto : ''})`;
}

function clasificarNivel(d){
  // Traduce severidad+confianza técnica a 3 niveles simples de semáforo.
  if(d.clase === 'NORMAL' || d.severidad === 'NORMAL')
    return {nivel:'normal', color:'#00ff88', icono:'🟢', texto:'Normal'};
  if(d.severidad === 'CRÍTICO')
    return {nivel:'atencion', color:'#ff4444', icono:'🔴', texto:'Atención'};
  return {nivel:'revisar', color:'#ffaa00', icono:'🟡', texto:'Para revisar'};
}

  try{
    const r = await fetch(`${URL_BASE_API}/api/alertas/capturas/estadisticas`, {credentials:'include'});

    const porClase = Object.entries(d.por_clase || {}).map(([k,v]) => `${k}: ${v}`).join(' · ') || 'ninguna todavía';
    el.innerHTML = `
      <span><b style="color:var(--a)">${d.total}</b> conexiones reales capturadas</span>

async function iniciarReentrenamiento(){
  const btn = document.getElementById('rt-btn');
  const errEl = document.getElementById('rt-error');
  const resEl = document.getElementById('rt-resultado');
  errEl.style.display = 'none'; resEl.style.display = 'none';
  btn.disabled = true;
  try{
    const r = await fetch(`${URL_BASE_API}/api/modelos/reentrenar`, {credentials:'include',method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({})});
    const d = await r.json();
    if(!d.ok){ errEl.textContent = d.mensaje; errEl.style.display = 'block'; btn.disabled = false; return; }
    document.getElementById('rt-progreso').style.display = 'block';
    pollReentrenamiento();
  }catch(e){
    errEl.textContent = 'Error de conexión: ' + e.message; errEl.style.display = 'block'; btn.disabled = false;
  }
}

function pollReentrenamiento(){
  const timer = setInterval(async () => {
    try{
      const r = await fetch(`${URL_BASE_API}/api/modelos/reentrenar/estado`, {credentials:'include'});
      const d = await r.json();
      const barra = document.getElementById('rt-barra');
      const paso = document.getElementById('rt-paso');
      const pct = document.getElementById('rt-pct');
      if(barra) barra.style.width = (d.progreso.porcentaje || 0) + '%';
      if(paso) paso.textContent = d.progreso.paso || '';
      if(pct) pct.textContent = (d.progreso.porcentaje || 0) + '%';

      if(!d.activo){
        clearInterval(timer);
        document.getElementById('rt-btn').disabled = false;
        if(d.error){
          const errEl = document.getElementById('rt-error');
          errEl.textContent = 'Error durante el reentrenamiento: ' + d.error;
          errEl.style.display = 'block';
        } else if(d.resultado){
          const resEl = document.getElementById('rt-resultado');
          const m = d.resultado;
          resEl.innerHTML = `✅ Modelo reentrenado con ${m.n_muestras_reales} muestras reales +
            ${m.n_muestras_base} de la base NSL-KDD.<br>
            MLP → Recall: ${(m.metricas_mlp.recall*100).toFixed(1)}% ·
            F1: ${(m.metricas_mlp.f1_score*100).toFixed(1)}%<br>
            RNN → Recall: ${(m.metricas_rnn.recall*100).toFixed(1)}% ·
            F1: ${(m.metricas_rnn.f1_score*100).toFixed(1)}%`;
          resEl.style.display = 'block';
          cargarStatsReentrenamiento();
        }
      }
    }catch(e){ /* reintenta en el próximo ciclo */ }
  }, 2000);
}

async function alternarMonitoreoRR(){
  const btn = document.getElementById('rr-btn');
  const errEl = document.getElementById('rr-error');
  errEl.style.display = 'none';
  btn.disabled = true;

  const estaActivo = btn.textContent.includes('Detener');
  try{
    if(estaActivo){
      btn.textContent = '⏳ Deteniendo...';
      await fetch(`${URL_BASE_API}/api/monitoreo/detener`, {credentials:'include',method:'POST'});
    }else{
      btn.textContent = '⏳ Iniciando...';
      const iface = document.getElementById('rr-iface').value.trim();
      const ventana = parseInt(document.getElementById('rr-ventana').value, 10);
      const r = await fetch(`${URL_BASE_API}/api/monitoreo/iniciar`, {credentials:'include',
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({iface: iface || null, ventana})
      });
      const d = await r.json();
      if(!d.ok){
        errEl.textContent = d.mensaje || 'No se pudo iniciar el monitoreo.';
        errEl.style.display = 'block';
      }
      rrIndice = 0; rrNormales = 0; rrRevisar = 0;
      document.getElementById('rr-eventos').innerHTML = '';
      document.getElementById('rr-total').textContent = '0';
      document.getElementById('rr-normales').textContent = '0';
      document.getElementById('rr-revisar').textContent = '0';
    }
  }catch(e){
    errEl.textContent = 'Error de conexión: ' + e.message;
    errEl.style.display = 'block';
  }
  setTimeout(() => { btn.disabled = false; actualizarEstadoRR(); }, 800);
}

async function analizar(tipo){

// ── Monitoreo de Red Real (continuo) ────────────────────────────────────────
function iniciarPollingRR(){
  if(rrPolling) return;
  rrPolling = true;

  rrTimer = setInterval(async () => {
    try{
      const r = await fetch(`${URL_BASE_API}/api/monitoreo/estado?desde=${rrIndice}`, {credentials:'include'});
      const d = await r.json();

      const warnEl = document.getElementById('rr-warn');
      if(warnEl){
        const prog = d.progreso || {};
        if(prog.flujos_omitidos > 0){
          warnEl.textContent = `ℹ ${prog.flujos_omitidos} conexión(es) no se pudieron clasificar y se omitieron automáticamente.`;
          warnEl.style.display = 'block';
        } else {
          warnEl.style.display = 'none';
        }
      }

      // Nuevos resultados: se inyectan en el MISMO flujo que analizar(),
      // así las tarjetas KPI, gráficas y centro de alertas ya construidos
      // se actualizan automáticamente, sin duplicar lógica de frontend.
      if(d.nuevos && d.nuevos.length){
        d.nuevos.forEach(res => {
          updCnt(res);
          if(res.alerta_generada) addAlerta(res);
          addLog(res);
          addDot(res);
          updDashAl();
          updCharts(res);

          const nivel = clasificarNivel(res);
          if(nivel.nivel === 'normal') rrNormales++; else rrRevisar++;

          mostrarResRR(res, nivel);
          agregarEventoRR(res, nivel);
        });
        rrIndice += d.nuevos.length;
        const totalEl = document.getElementById('rr-total');
        const normEl = document.getElementById('rr-normales');
        const revEl = document.getElementById('rr-revisar');
        if(totalEl) totalEl.textContent = rrIndice;
        if(normEl) normEl.textContent = rrNormales;
        if(revEl) revEl.textContent = rrRevisar;
      }

      // El estado (activo/inactivo/interfaz) se refleja solo si la pantalla
      // 'Red Real' está abierta; si el usuario está en otra pestaña, el
      // polling sigue igual actualizando KPIs globales del dashboard.
      if(document.getElementById('rr-btn')) actualizarEstadoRR();
    }catch(e){ /* red momentáneamente no disponible, sigue intentando */ }
  }, 1500);
}

// Lista de "Actividad reciente": tarjetas cortas en lenguaje humano,
// la más nueva arriba, máximo 20 visibles para no saturar.
function agregarEventoRR(d, nivel){
  const cont = document.getElementById('rr-eventos');
  if(!cont) return;
  if(cont.children.length === 1 && cont.children[0].dataset && cont.children[0].dataset.vacio)
    cont.innerHTML = '';

  const ts = new Date().toLocaleTimeString('es-EC', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const destino = describirDestino(d._flujo);
  const dispositivo = d._dispositivo && !d._dispositivo.includes('no identificado') && !d._dispositivo.includes('genérico')
    ? ` · ${d._dispositivo}` : '';

  // Si la MISMA conexión (mismo destino) se repite justo antes, no se
  // agrega una línea nueva idéntica: se actualiza un contador en la
  // existente. Esto evita el ruido de ver 5 líneas iguales seguidas.
  const primero = cont.firstElementChild;
  if(primero && primero.dataset.destino === destino){
    let contador = parseInt(primero.dataset.contador || '1', 10) + 1;
    primero.dataset.contador = contador;
    primero.querySelector('.rr-ev-ts').textContent = `${ts} · ${nivel.texto} · ${contador} veces`;
    return;
  }

  const div = document.createElement('div');
  div.dataset.destino = destino;
  div.dataset.contador = '1';
  div.style.cssText = `display:flex;align-items:center;gap:10px;padding:8px 10px;
    background:var(--s2);border:1px solid var(--b);border-left:3px solid ${nivel.color};
    border-radius:6px;font-size:.76rem`;
  div.innerHTML = `
    <span style="font-size:1rem">${nivel.icono}</span>
    <div style="flex:1;min-width:0">
      <div style="color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${destino}${dispositivo}</div>
      <div class="rr-ev-ts" style="color:var(--m);font-size:.68rem">${ts} · ${nivel.texto}</div>
    </div>`;
  cont.insertBefore(div, cont.firstChild);
  while(cont.children.length > 20) cont.removeChild(cont.lastChild);
}

// ── Gráficas Canvas ────────────────────────────────────────────────────────
let dLine={DoS:[],Probe:[],R2L:[],U2R:[],NORMAL:[]};
let dDon={DoS:0,Probe:0,R2L:0,U2R:0,NORMAL:0};
const MAX=20;

function initC(){setTimeout(()=>{drawLine();drawDon();},100)}

function updCharts(d){
  if(dLine[d.clase]!==undefined){
    dLine[d.clase].push(d.confianza);
    if(dLine[d.clase].length>MAX)dLine[d.clase].shift();
  }
  dDon[d.clase]=(dDon[d.clase]||0)+1;
  if(pg_act==='dashboard'){drawLine();drawDon();}
}

function drawLine(){
  const cv=document.getElementById('cLine');if(!cv)return;
  const ctx=cv.getContext('2d');
  cv.width=cv.offsetWidth||400;cv.height=150;
  const W=cv.width,H=cv.height;
  ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#1e3a5f';ctx.lineWidth=1;
  for(let y=H*.1;y<H;y+=H/5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  Object.entries(dLine).forEach(([k,v])=>{
    if(v.length<2)return;
    ctx.beginPath();ctx.strokeStyle=COL[k]||'#888';ctx.lineWidth=2;
    v.forEach((val,i)=>{
      const x=(i/(MAX-1))*W,y=H-(val/100)*(H*.82)-H*.06;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });ctx.stroke();
    if(v.length>0){
      const x=((v.length-1)/(MAX-1))*W,y=H-(v[v.length-1]/100)*(H*.82)-H*.06;
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fillStyle=COL[k];ctx.fill();
    }
  });
  let lx=6;
  Object.entries(COL).forEach(([k,c])=>{
    ctx.fillStyle=c;ctx.fillRect(lx,H-12,8,3);
    ctx.fillStyle='#7a9ab5';ctx.font='8px Share Tech Mono,monospace';
    ctx.fillText(k,lx+11,H-9);lx+=ctx.measureText(k).width+22;
  });
}

function drawDon(){
  const cv=document.getElementById('cDonut');if(!cv)return;
  const ctx=cv.getContext('2d');
  cv.width=cv.offsetWidth||300;cv.height=150;
  const W=cv.width,H=cv.height;
  ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);
  const tot=Object.values(dDon).reduce((a,b)=>a+b,0);
  if(!tot){
    ctx.fillStyle='#1e3a5f';ctx.font='11px Rajdhani,sans-serif';
    ctx.textAlign='center';ctx.fillText('Sin datos',W*.4,H/2);return;
  }
  const cx=W*.4,cy=H/2,r=H*.38,ri=H*.2;
  let ang=-Math.PI/2;
  Object.entries(dDon).forEach(([k,v])=>{
    if(!v)return;const s=(v/tot)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,ang+s);
    ctx.closePath();ctx.fillStyle=COL[k]||'#888';ctx.fill();
    ctx.strokeStyle='#111827';ctx.lineWidth=2;ctx.stroke();ang+=s;
  });
  ctx.beginPath();ctx.arc(cx,cy,ri,0,Math.PI*2);
  ctx.fillStyle='#111827';ctx.fill();
  ctx.fillStyle='#00d4ff';ctx.font='bold 15px Rajdhani,sans-serif';
  ctx.textAlign='center';ctx.fillText(tot,cx,cy+2);
  ctx.fillStyle='#4a6a8a';ctx.font='7px Share Tech Mono,monospace';
  ctx.fillText('TOTAL',cx,cy+12);
  let ly=12;ctx.textAlign='left';
  Object.entries(dDon).forEach(([k,v])=>{
    if(!v)return;
    ctx.fillStyle=COL[k];ctx.fillRect(cx+r+10,ly,8,8);
    ctx.fillStyle='#c8d8e8';ctx.font='9px Rajdhani,sans-serif';
    ctx.fillText(k+' ('+v+')',cx+r+22,ly+7);ly+=16;
  });
}

// ── Alertas ────────────────────────────────────────────────────────────────
function alHTML(a,i){
  const ico={CRÍTICO:'🔴',ADVERTENCIA:'🟡',INFORMACIÓN:'🔵',NORMAL:'✅'};
  const ts=a.timestamp?new Date(a.timestamp).toLocaleTimeString('es-EC'):'';
  const sc='s'+(a.severidad==='CRÍTICO'?'C':a.severidad==='ADVERTENCIA'?'A':
    a.severidad==='NORMAL'?'N':'I');
  const cc='c'+(a.severidad==='CRÍTICO'?'C':a.severidad==='ADVERTENCIA'?'A':'N');
  const fuenteTag = a._fuente === 'red_real'
    ? '<span style="font-size:.62rem;color:#00ff88;border:1px solid #00ff8844;border-radius:8px;padding:1px 6px">🌐 Red real</span>'
    : '<span style="font-size:.62rem;color:#ffaa00;border:1px solid #ffaa0044;border-radius:8px;padding:1px 6px">🧪 Simulación</span>';

  // Etiquetado humano real (solo tiene sentido para tráfico real, no para
  // simulaciones que ya "sabemos" qué son): alimenta el reentrenamiento.
  const etiquetaBtns = (a._fuente === 'red_real' && a._captura_id && !a._etiquetado)
    ? `<span style="cursor:pointer;color:#00ff88" onclick="etiquetarDeteccion(${i},'${a.clase}')">✓ Confirmar</span>
       <span style="cursor:pointer;color:#ff8888" onclick="etiquetarDeteccion(${i},'NORMAL')">✗ Falso positivo</span>`
    : (a._etiquetado ? `<span style="color:#4a6a8a">✓ Etiquetado: ${a._etiquetado}</span>` : '');

  return`<div class="al-item" id="al-${i}">
    <div class="al-sev ${sc}"></div>
    <div class="al-body">
      <div class="al-title">${ico[a.severidad]||'🔵'} ${a.clase} – ${a.severidad} ${fuenteTag}</div>
      <div class="al-desc">${a.alerta?.descripcion||'Amenaza detectada'}</div>
      <div class="al-meta"><span>${ts}</span>
        <span class="cb ${cc}">${a.confianza}%</span>
        ${etiquetaBtns}
      </div>
    </div>
  </div>`;}

async function etiquetarDeteccion(i, etiqueta){
  const a = alertas[i];
  if(!a || !a._captura_id) return;
  try{
    await fetch(`${URL_BASE_API}/api/alertas/capturas/${a._captura_id}/etiquetar`, {credentials:'include',
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({etiqueta})
    });
    a._etiquetado = etiqueta;
    updDashAl();
    const listaEl = document.getElementById('lista-al');
    if(listaEl) filtrar('todas');
  }catch(e){ alert('No se pudo guardar la corrección: ' + e.message); }
}

function addAlerta(d){
  alertas.unshift(d);if(alertas.length>50)alertas.pop();
  document.getElementById('badge').textContent=alertas.length;
  updDashAl();
}

function updDashAl(){
  const el=document.getElementById('dash-al');if(!el)return;
  el.innerHTML=alertas.length===0
    ?'<div style="color:var(--m);text-align:center;padding:16px;font-size:.8rem">Sin alertas</div>'
    :alertas.slice(0,5).map((a,i)=>alHTML(a,i)).join('');
}

function filtrar(niv){
  const el=document.getElementById('lista-al');if(!el)return;
  const f=niv==='todas'?alertas:alertas.filter(a=>a.severidad===niv);
  el.innerHTML=f.length===0
    ?'<div style="color:var(--m);text-align:center;padding:30px">Sin alertas de ese nivel</div>'
    :f.map((a,i)=>alHTML(a,i)).join('');
}

// ── Experimentos ───────────────────────────────────────────────────────────
async function loadExp(){
  try{
    const r=await fetch(`${URL_BASE_API}/api/experimentos`, {credentials:'include'});const d=await r.json();
    if(!d.modelos)return;
    const mods=Object.entries(d.modelos);
    const tbl=document.getElementById('tbl-exp');
    if(tbl){
      tbl.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:.8rem">
        <thead><tr>${['Modelo','Recall ↑','Precisión','F1','Acc','T.Train'].map(h=>
          `<th style="padding:7px 11px;text-align:left;border-bottom:1px solid var(--b);
            color:var(--a);font-size:.68rem;letter-spacing:.5px">${h}</th>`).join('')}</tr></thead>
        <tbody>${mods.map(([n,m],i)=>{const best=i===0;return`
          <tr style="border-bottom:1px solid var(--b);${best?'background:rgba(0,212,255,.04)':''}">
            <td style="padding:7px 11px;font-weight:${best?700:400};
              color:${best?'var(--a)':'var(--t)'}">${n}${best?' ★':''}</td>
            <td style="padding:7px 11px;color:${best?'var(--g)':'var(--t)'};font-weight:700">
              ${(m.recall*100).toFixed(2)}%</td>
            <td style="padding:7px 11px">${(m.precision*100).toFixed(2)}%</td>
            <td style="padding:7px 11px">${(m.f1_score*100).toFixed(2)}%</td>
            <td style="padding:7px 11px">${(m.accuracy*100).toFixed(2)}%</td>
            <td style="padding:7px 11px;font-family:'Share Tech Mono',monospace;
              color:var(--m)">${m.tiempo_train_s}s</td>
          </tr>`}).join('')}</tbody></table>`;
    }
    // Gráfica Recall
    setTimeout(()=>{
      const cv=document.getElementById('cRecall');if(!cv)return;
      const ctx=cv.getContext('2d');
      cv.width=cv.offsetWidth||380;cv.height=220;
      const W=cv.width,H=cv.height;
      ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);
      const cols=['#00d4ff','#aa66ff','#00ff88','#ff8800','#ff4444','#ffcc00'];
      const bw=28,gap=14,sx=36;
      mods.forEach(([n,m],i)=>{
        const x=sx+i*(bw+gap),h=(m.recall)*(H-55);
        const c=cols[i%cols.length];
        ctx.fillStyle=c+'44';ctx.fillRect(x,H-40-h,bw,h);
        ctx.fillStyle=c;ctx.fillRect(x,H-40-3,bw,3);
        ctx.fillStyle='#c8d8e8';ctx.font='8px Share Tech Mono,monospace';
        ctx.textAlign='center';
        ctx.fillText((m.recall*100).toFixed(1)+'%',x+bw/2,H-40-h-4);
        ctx.save();ctx.translate(x+bw/2,H-25);ctx.rotate(-Math.PI/4);
        ctx.fillText(n.split(' ')[0],0,0);ctx.restore();
      });
      const y85=H-40-(0.85)*(H-55);
      ctx.strokeStyle='#ffaa0066';ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(sx,y85);ctx.lineTo(W-10,y85);ctx.stroke();
      ctx.fillStyle='#ffaa00';ctx.font='8px Share Tech Mono,monospace';
      ctx.textAlign='left';ctx.fillText('85%',W-26,y85-3);

      // Tiempo
      const cv2=document.getElementById('cTiempo');if(!cv2)return;
      const ctx2=cv2.getContext('2d');
      cv2.width=cv2.offsetWidth||380;cv2.height=220;
      ctx2.fillStyle='#111827';ctx2.fillRect(0,0,cv2.width,cv2.height);
      const maxT=Math.max(...mods.map(([,m])=>m.tiempo_train_s));
      mods.forEach(([n,m],i)=>{
        const x=sx+i*(bw+gap),h=(m.tiempo_train_s/maxT)*(H-55);
        const c=cols[i%cols.length];
        ctx2.fillStyle=c+'44';ctx2.fillRect(x,H-40-h,bw,h);
        ctx2.fillStyle=c;ctx2.fillRect(x,H-40-3,bw,3);
        ctx2.fillStyle='#c8d8e8';ctx2.font='8px Share Tech Mono,monospace';
        ctx2.textAlign='center';
        ctx2.fillText(m.tiempo_train_s+'s',x+bw/2,H-40-h-4);
        ctx2.save();ctx2.translate(x+bw/2,H-25);ctx2.rotate(-Math.PI/4);
        ctx2.fillText(n.split(' ')[0],0,0);ctx2.restore();
      });
    },150);
  }catch(e){console.error(e)}
}
